<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">页声 PageVoice 第一版设计视觉</title>
  <desc id="desc">暖纸色背景上是一本打开的书，书页文字与声波重叠，表达阅读与朗读同步。</desc>
  <defs>
    <linearGradient id="paper" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FCF8F0"/>
      <stop offset="0.56" stop-color="#F3EBDD"/>
      <stop offset="1" stop-color="#E9DFCE"/>
    </linearGradient>
    <linearGradient id="book" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#31443B"/>
      <stop offset="1" stop-color="#1F2A25"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#D97757"/>
      <stop offset="1" stop-color="#B9503E"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.96"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </radialGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#253029" flood-opacity="0.23"/>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#paper)"/>
  <circle cx="1310" cy="130" r="250" fill="url(#glow)"/>
  <circle cx="1180" cy="720" r="300" fill="#D97757" opacity="0.055" filter="url(#soft)"/>

  <g opacity="0.23" stroke="#58615B" stroke-width="1">
    <path d="M0 160H1600"/>
    <path d="M0 740H1600"/>
    <path d="M120 0V900"/>
    <path d="M1480 0V900"/>
  </g>

  <g transform="translate(116 110)">
    <rect width="88" height="30" rx="15" fill="#253029"/>
    <text x="44" y="20" text-anchor="middle" font-family="Arial, sans-serif" font-size="11" font-weight="700" letter-spacing="2.2" fill="#FCF8F0">PAGEVOICE</text>
    <text x="0" y="146" font-family="Georgia, 'Songti SC', serif" font-size="104" font-weight="700" letter-spacing="-4" fill="#253029">页声</text>
    <text x="4" y="190" font-family="Arial, sans-serif" font-size="18" font-weight="700" letter-spacing="4.8" fill="#CB6A4B">让文字留下声音</text>
    <text x="4" y="250" font-family="'Songti SC', Georgia, serif" font-size="29" fill="#58615B">先像一本书，再像一台播放器。</text>
    <text x="4" y="292" font-family="'Songti SC', Georgia, serif" font-size="29" fill="#58615B">声音走到哪里，纸张就亮到哪里。</text>
    <path d="M4 343H390" stroke="#D3A552" stroke-width="4" stroke-linecap="round"/>
    <text x="4" y="386" font-family="Arial, 'PingFang SC', sans-serif" font-size="15" fill="#8C938D" letter-spacing="1.1">本地阅读  /  系统朗读  /  同步高亮  /  音频导出</text>
  </g>

  <g transform="translate(742 118) rotate(5 330 330)" filter="url(#shadow)">
    <path d="M10 76C124 43 242 55 331 116V619C242 558 124 546 10 579Z" fill="url(#book)"/>
    <path d="M652 76C538 43 420 55 331 116V619C420 558 538 546 652 579Z" fill="url(#book)"/>
    <path d="M32 105C133 79 231 89 310 137V577C231 529 133 519 32 545Z" fill="#FBF6EB"/>
    <path d="M630 105C529 79 431 89 352 137V577C431 529 529 519 630 545Z" fill="#F7F1E6"/>
    <path d="M331 116V619" stroke="#9B876E" stroke-width="3" opacity="0.35"/>

    <g stroke="#58615B" stroke-width="7" stroke-linecap="round" opacity="0.27">
      <path d="M74 173H248"/>
      <path d="M74 207H273"/>
      <path d="M74 241H229"/>
      <path d="M74 309H278"/>
      <path d="M74 343H244"/>
      <path d="M74 377H286"/>
      <path d="M74 445H219"/>
      <path d="M74 479H267"/>
      <path d="M74 513H232"/>
    </g>
    <rect x="65" y="266" width="230" height="29" rx="7" fill="#F1D69B" opacity="0.8"/>
    <path d="M80 282H279" stroke="#B98939" stroke-width="7" stroke-linecap="round" opacity="0.74"/>

    <g stroke="#58615B" stroke-width="7" stroke-linecap="round" opacity="0.23">
      <path d="M385 173H568"/>
      <path d="M385 207H598"/>
      <path d="M385 241H532"/>
      <path d="M385 309H576"/>
      <path d="M385 343H551"/>
      <path d="M385 377H594"/>
      <path d="M385 445H563"/>
      <path d="M385 479H528"/>
    </g>
    <rect x="375" y="266" width="143" height="29" rx="7" fill="#F1D69B" opacity="0.38"/>

    <g transform="translate(384 486)">
      <circle cx="58" cy="58" r="58" fill="url(#accent)"/>
      <path d="M48 38L79 58L48 78Z" fill="#FCF8F0"/>
    </g>
  </g>

  <g transform="translate(1140 630)" stroke="#CB6A4B" stroke-linecap="round" fill="none">
    <path d="M0 45C32 2 32 88 64 45C87 14 87 76 110 45" stroke-width="5" opacity="0.95"/>
    <path d="M-20 45C28 -15 28 105 76 45C108 5 108 85 140 45" stroke-width="3" opacity="0.44"/>
    <path d="M-40 45C24 -30 24 120 88 45C124 -2 124 92 164 45" stroke-width="2" opacity="0.2"/>
  </g>

  <g transform="translate(116 810)">
    <text x="0" y="0" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#8C938D">PAGEVOICE · V1 DESIGN TEASER</text>
    <text x="1368" y="0" text-anchor="end" font-family="Arial, 'PingFang SC', sans-serif" font-size="13" fill="#8C938D">LOCAL FIRST · ANDROID 8.0+</text>
  </g>
</svg>
