<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="theme-color" content="#f7f1e6">
    <meta name="description" content="页声 Web 阅读器，手机与电脑共享阅读进度。">
    <title>页声 · Web Reader</title>
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" href="./icons/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="./styles.css">
  </head>
  <body>
    <div class="app-shell" id="appShell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="页声首页">
          <span class="brand-mark" aria-hidden="true">
            <svg viewBox="0 0 32 32">
              <path d="M5 8.5c4-1.2 7-.4 11 2.4v14c-4-2.8-7-3.6-11-2.4z"/>
              <path d="M27 8.5c-4-1.2-7-.4-11 2.4v14c4-2.8 7-3.6 11-2.4z"/>
              <circle cx="16" cy="15" r="2.2"/>
            </svg>
          </span>
          <span>
            <strong>页声</strong>
            <small>PageVoice</small>
          </span>
        </a>
        <div class="top-actions">
          <span class="sync-state" id="syncState" data-state="local">仅保存在此设备</span>
          <button class="button button-quiet" id="openSettingsButton" type="button">
            <span class="settings-label">同步设置</span>
            <span class="settings-icon" aria-hidden="true">⚙</span>
          </button>
          <button class="button button-dark" id="syncButton" type="button">同步进度</button>
        </div>
      </header>

      <main class="workspace">
        <aside class="library-panel" id="libraryPanel" aria-label="本地书架">
          <div class="library-heading">
            <div>
              <p class="eyebrow">YOUR LIBRARY</p>
              <h1>书架</h1>
            </div>
            <label class="import-button" for="fileInput" title="导入 Markdown 或 TXT">
              <span>＋</span>
              <input id="fileInput" type="file" accept=".md,.markdown,.txt,text/markdown,text/plain" multiple>
            </label>
          </div>

          <label class="search-box">
            <svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10.5" cy="10.5" r="6.5"></circle>
              <path d="m15.5 15.5 4 4"></path>
            </svg>
            <input id="searchInput" type="search" placeholder="搜索书名" autocomplete="off">
          </label>

          <div class="shelf-summary">
            <span id="bookCount">0 本书</span>
            <span id="syncBookCount"></span>
          </div>
          <div class="book-list" id="bookList"></div>
        </aside>

        <section class="reader-panel" id="readerPanel" aria-live="polite">
          <div class="reader-empty" id="readerEmpty">
            <div class="empty-book" aria-hidden="true">
              <span></span><span></span>
            </div>
            <p class="eyebrow">READ WITHOUT NOISE</p>
            <h2>从一页开始</h2>
            <p>导入 Markdown 或 TXT。阅读位置会保存在浏览器里，配置同步后也能在手机和其他电脑继续。</p>
            <label class="button button-dark" for="fileInput">导入一本书</label>
          </div>

          <div class="reader-view" id="readerView" hidden>
            <header class="reader-header">
              <button class="icon-button mobile-back" id="mobileBackButton" type="button" aria-label="返回书架">←</button>
              <div class="reader-title-block">
                <p class="eyebrow" id="bookFormat">LOCAL TEXT</p>
                <h2 id="bookTitle">书名</h2>
              </div>
              <div class="reader-meta">
                <span id="syncBadge">本地</span>
                <button class="icon-button" id="fontButton" type="button" aria-label="切换字号">Aa</button>
              </div>
            </header>

            <div class="reading-progress" aria-hidden="true">
              <span id="readingProgressBar"></span>
            </div>

            <div class="chapter-nav">
              <button class="icon-button" id="previousChapterButton" type="button" aria-label="上一章">←</button>
              <div class="chapter-copy">
                <span id="chapterIndex">第 1 章</span>
                <strong id="chapterTitle">第一章</strong>
              </div>
              <button class="icon-button" id="nextChapterButton" type="button" aria-label="下一章">→</button>
            </div>

            <article class="page-content" id="pageContent"></article>

            <div class="reader-controls">
              <div class="voice-summary">
                <span class="voice-dot" id="voiceDot" aria-hidden="true"></span>
                <span id="nowReadingLabel">点击句子开始朗读</span>
              </div>
              <div class="control-row">
                <button class="icon-button" id="previousSentenceButton" type="button" aria-label="上一句">⏮</button>
                <button class="play-button" id="playButton" type="button" aria-label="开始朗读">▶</button>
                <button class="icon-button" id="nextSentenceButton" type="button" aria-label="下一句">⏭</button>
                <label class="select-wrap">
                  <span class="sr-only">朗读声音</span>
                  <select id="voicePreset">
                    <option value="female">女声</option>
                    <option value="male">男声</option>
                  </select>
                </label>
                <button class="text-button" id="speedButton" type="button">1.0×</button>
              </div>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="settings-dialog" id="settingsDialog">
      <form method="dialog" class="settings-card">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">SELF-HOSTED SYNC</p>
            <h2>同步设置</h2>
          </div>
          <button class="icon-button" value="cancel" aria-label="关闭">×</button>
        </div>
        <p class="settings-note">只同步阅读位置，不上传书籍正文。手机和电脑需要连接到同一个同步服务。</p>

        <label class="field">
          <span>服务地址</span>
          <input id="syncEndpointInput" type="url" placeholder="http://127.0.0.1:8787/api/v1" autocomplete="off">
        </label>
        <label class="field">
          <span>个人同步令牌</span>
          <input id="syncTokenInput" type="password" placeholder="服务启动时显示" autocomplete="off">
        </label>
        <label class="field">
          <span>当前设备 ID</span>
          <input id="deviceIdInput" type="text" readonly>
        </label>

        <div class="settings-actions">
          <button class="button button-quiet" id="resetDeviceButton" type="button">更换设备 ID</button>
          <button class="button button-dark" id="saveSettingsButton" type="button">保存并同步</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status"></div>
    <script type="module" src="./app.js"></script>
  </body>
</html>
